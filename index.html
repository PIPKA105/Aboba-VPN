<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>PokBox</title>
<script src="https://js.puter.com/v2/"></script>
<style>
:root{--bg:#edf2ec;--pn:#f8faf7;--bd:#d5ded3;--fg:#1b2b22;--mut:#66756b;--ac:#3b7d4f;--ai:#fff;--sh:0 12px 36px #1b2b2224}
@media(prefers-color-scheme:dark){:root{--bg:#101814;--pn:#17211b;--bd:#27372d;--fg:#e4ede6;--mut:#8aa093;--ac:#5fb27b;--ai:#0d1510;--sh:0 12px 36px #000a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;display:flex;background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
svg{flex:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.ib{display:grid;place-items:center;width:36px;height:36px;border:0;border-radius:10px;background:none;transition:background .2s,transform .2s}
.ib:hover{background:color-mix(in srgb,var(--ac) 14%,transparent)}.ib:active{transform:scale(.92)}
#sb{width:272px;background:var(--pn);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 10px calc(10px + env(safe-area-inset-bottom,0px));transition:transform .34s cubic-bezier(.2,.8,.2,1);z-index:20}
.brand{font:600 23px "Iowan Old Style","Palatino Linotype",Georgia,serif;padding:2px 8px 12px}
#nc{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--bd);border-radius:12px;background:none;transition:border-color .2s,transform .2s}
#nc:hover{border-color:var(--ac)}#nc:active{transform:scale(.97)}
#cl{flex:1;overflow:auto;margin:10px 0}
.ci{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:10px;cursor:pointer;transition:background .2s}
.ci span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci:hover{background:color-mix(in srgb,var(--ac) 10%,transparent)}
.ci.on{background:color-mix(in srgb,var(--ac) 20%,transparent)}
.ci button{border:0;background:none;opacity:0;color:var(--mut);font-size:18px;line-height:1;transition:opacity .2s}
.ci:hover button{opacity:1}
.ft{display:flex;align-items:center;gap:8px;border-top:1px solid var(--bd);padding-top:10px}
.av{width:30px;height:30px;border-radius:50%;background:var(--ac);color:var(--ai);display:grid;place-items:center;font-weight:600;flex:none}
#un{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
#ms{flex:1;display:flex;flex-direction:column;min-width:0}
header{display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;position:relative;z-index:10}
#bg,#sc{display:none}
.mw{position:relative}
.pill{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 8px;border:1px solid var(--bd);background:var(--pn);border-radius:12px;transition:border-color .2s}
.pill:hover{border-color:var(--ac)}
.pill>svg{transition:transform .28s}.mw.on .pill>svg{transform:rotate(180deg)}
#menu{position:absolute;top:calc(100% + 8px);left:0;width:min(330px,92vw);background:var(--pn);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh);opacity:0;visibility:hidden;transform:translateY(-8px) scale(.97);transform-origin:top left;transition:opacity .22s,transform .26s cubic-bezier(.2,.8,.2,1),visibility .26s}
.mw.on #menu{opacity:1;visibility:visible;transform:none}
#mi{max-height:50vh;overflow:auto;padding:6px}
.it{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer;transition:background .18s}
.it:hover{background:color-mix(in srgb,var(--ac) 12%,transparent)}
.it.sel{background:color-mix(in srgb,var(--ac) 22%,transparent);font-weight:600}
.gh{display:flex;align-items:center;gap:8px;padding:10px 10px 4px;font-size:13px;color:var(--mut)}
.lg{width:22px;height:22px;flex:none;object-fit:contain}
.star{border-radius:6px;display:grid;place-items:center;background:var(--ac);color:var(--ai)}.star svg{width:14px;height:14px}
.eb{border-top:1px solid var(--bd);padding:10px 16px 12px}
.el{display:flex;justify-content:space-between;font-size:13px;color:var(--mut)}.el b{color:var(--fg)}
.tr{position:relative;height:6px;margin:16px 4px 8px;border-radius:3px;background:var(--bd);touch-action:none;cursor:pointer}
.tr::before{content:"";position:absolute;left:0;top:0;bottom:0;width:calc(var(--p,.5)*100%);border-radius:3px;background:var(--ac)}
.tr i{position:absolute;top:50%;left:calc(var(--p,.5)*100%);width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--pn);border:3px solid var(--ac);box-shadow:var(--sh)}
.tr:not(.dr)::before,.tr:not(.dr) i{transition:all .4s cubic-bezier(.3,1.35,.5,1)}
.ts{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
#chat{flex:1;overflow:auto;padding:12px 16px 20px;scroll-behavior:smooth}
#hero{max-width:520px;margin:9vh auto 0;text-align:center}
#hero h1{font:600 clamp(30px,6vw,44px)/1.1 "Iowan Old Style","Palatino Linotype",Georgia,serif;margin:18px 0 10px}
#hero p{color:var(--mut);margin:0}
#hl{display:flex;justify-content:center;gap:14px}
#hl .lg{width:48px;height:48px;animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
#hl .lg:nth-child(2){animation-delay:.12s}#hl .lg:nth-child(3){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.9)}}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.msg{max-width:760px;margin:0 auto 16px;display:flex;gap:10px;animation:in .32s cubic-bezier(.2,.8,.2,1)}
.msg.u{justify-content:flex-end}
.msg .lg{margin-top:6px}
.b{padding:10px 14px;border-radius:14px;background:var(--pn);border:1px solid var(--bd);min-width:0;overflow-wrap:anywhere}
.u .b{background:color-mix(in srgb,var(--ac) 18%,var(--pn))}
.a .b{border-left:3px solid var(--fc,var(--bd))}
.meta{font-size:12px;color:var(--mut);margin-top:6px}
code{background:#7f8c8420;padding:1px 5px;border-radius:5px;font:.9em ui-monospace,Menlo,monospace}
.file{display:flex;align-items:center;gap:10px;margin-top:10px;padding:9px 10px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);transition:transform .2s,box-shadow .2s}
.file:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.fi{display:grid;place-items:center;width:38px;height:38px;border-radius:9px;background:var(--ac);color:var(--ai);font:700 11px ui-monospace,monospace}
.file b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file small{color:var(--mut)}
.file button{border:1px solid var(--bd);background:var(--pn);border-radius:9px;padding:5px 10px;transition:border-color .2s,color .2s}
.file button:hover{border-color:var(--ac);color:var(--ac)}
.dots i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--mut);animation:bn 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bn{50%{transform:translateY(-5px);opacity:.4}}
footer{padding:6px 14px calc(12px + env(safe-area-inset-bottom,0px))}
.box{max-width:760px;margin:auto;display:flex;gap:8px;align-items:flex-end;background:var(--pn);border:1px solid var(--bd);border-radius:18px;padding:8px;transition:border-color .2s,box-shadow .2s}
.box:focus-within{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
textarea{flex:1;border:0;outline:0;resize:none;background:none;color:inherit;font:inherit;max-height:160px;padding:6px 8px}
#go{width:38px;height:38px;border:0;border-radius:12px;background:var(--ac);color:var(--ai);display:grid;place-items:center;transition:transform .2s,opacity .2s}
#go:hover{transform:translateY(-2px)}#go:active{transform:scale(.9)}
#gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:24px;transition:opacity .5s,visibility .5s}
#gate.off{opacity:0;visibility:hidden}
.gc{max-width:360px;text-align:center;animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
.gc h1{font:600 32px/1.15 "Iowan Old Style","Palatino Linotype",Georgia,serif;margin:18px 0 8px}
.gc p{color:var(--mut);margin:0}
.gb{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px;margin-top:22px;border:1px solid var(--bd);border-radius:14px;background:var(--pn);font-weight:600;transition:border-color .2s,transform .2s,box-shadow .2s}
.gb:hover{border-color:var(--ac);transform:translateY(-2px);box-shadow:var(--sh)}.gb:active{transform:scale(.98)}
.gc small{display:block;margin-top:10px;color:var(--mut)}
.gc .sk{border:0;background:none;color:var(--mut);margin-top:14px;text-decoration:underline}
dialog{border:1px solid var(--bd);border-radius:18px;background:var(--pn);color:var(--fg);padding:18px;width:min(520px,92vw);box-shadow:var(--sh)}
dialog[open]{animation:pop .3s cubic-bezier(.2,.8,.2,1)}
dialog::backdrop{background:#0006;backdrop-filter:blur(3px)}
@keyframes pop{from{opacity:0;transform:scale(.95) translateY(10px)}}
dialog h3{margin:0 0 4px;font-size:18px}
dialog label{display:block;font-size:13px;color:var(--mut);margin-top:12px}
dialog input,dialog textarea{width:100%;margin-top:4px;padding:9px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--fg);font:inherit}
.row{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
#pv{width:min(900px,96vw)}#pv iframe{width:100%;height:68vh;border:0;border-radius:10px;background:#fff;margin-top:10px}
#toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,16px);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:12px;opacity:0;visibility:hidden;transition:all .3s;z-index:60;max-width:90vw}
#toast.on{opacity:1;visibility:visible;transform:translate(-50%,0)}
@media(max-width:800px){#sb{position:fixed;inset:0 auto 0 0;transform:translateX(-102%);box-shadow:var(--sh)}#sb.open{transform:none}#bg{display:grid}#sc{display:block;position:fixed;inset:0;background:#0006;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;z-index:15}#sb.open~#sc{opacity:1;visibility:visible}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(prefers-color-scheme:dark){img[data-f=gpt]{filter:invert(1)}}
</style></head><body>
<aside id="sb">
<div class="brand">PokBox</div>
<button id="nc"><span data-i="M12 5v14M5 12h14"></span>Новый чат</button>
<div id="cl"></div>
<div class="ft"><div class="av" id="av">?</div><span id="un">Гость</span><button class="ib" id="st" title="Настройки" data-i="M4 7h16M4 17h16M9 4v6M15 14v6"></button></div>
</aside>
<div id="sc"></div>
<div id="ms">
<header>
<button class="ib" id="bg" data-i="M4 7h16M4 12h16M4 17h16"></button>
<div class="mw"><button class="pill" id="mb"><span id="ml"></span><span id="mnm">Авто</span><span data-i="M7 10l5 5 5-5"></span></button>
<div id="menu"><div id="mi"></div>
<div class="eb"><div class="el"><span>Усилие модели</span><b id="ev">Норма</b></div>
<div class="tr" id="tr"><i></i></div><div class="ts"><span>Быстро</span><span>Норма</span><span>Глубоко</span></div></div></div></div>
</header>
<main id="chat"></main>
<footer><div class="box"><textarea id="in" rows="1" placeholder="Напишите сообщение"></textarea><button id="go" data-i="M12 19V5M6 11l6-6 6 6"></button></div></footer>
</div>
<div id="gate"><div class="gc"><div id="gl" style="display:flex;justify-content:center;gap:12px"></div><h1>Войдите один раз</h1><p>Один вход открывает все модели: Claude, Gemini и ChatGPT.</p>
<button class="gb" id="gg"><span class="av">G</span>Продолжить с Google</button><small>Откроется окно входа Puter, в нём Google в один тап.</small><button class="sk" id="sk">Пока без входа</button></div></div>
<dialog id="dlg"><h3>Настройки</h3>
<label>Ключ OpenRouter (бесплатные модели :free)<input id="c_or" type="password" autocomplete="off"></label>
<label>Ключ Google AI Studio (бесплатный тариф Gemini)<input id="c_gk" type="password" autocomplete="off"></label>
<label>Другие сайты, любой OpenAI-совместимый, например Poe (JSON)<textarea id="c_x" rows="4" placeholder='[{"name":"Poe","url":"https://api.poe.com/v1/chat/completions","key":"...","models":{"claude":"Claude-Sonnet-4.5","gemini":"Gemini-2.5-Flash","gpt":"GPT-5-mini"}}]'></textarea></label>
<div class="row"><button class="pill" id="px2">Закрыть</button><button class="pill" id="sv">Сохранить</button></div></dialog>
<dialog id="pv"><div style="display:flex;justify-content:space-between;align-items:center"><b>Просмотр</b><button class="ib" id="px" data-i="M6 6l12 12M18 6L6 18"></button></div><iframe id="pf" sandbox="allow-scripts allow-forms allow-modals"></iframe></dialog>
<div id="toast"></div>

 else add({r:'assistant',c:'Ни один сайт не ответил. Проверьте интернет, войдите в Puter или добавьте ключи в настройках.',f:mod.f,n:mod.n,v:'',e:1});
 save();busy=0}
async function loadPuter(){try{const L=await puter.ai.listModels(),add=[];
 for(const x of L){const id=typeof x==='string'?x:x.id,f=id&&fam(id);if(!f||/embed|image|tts|speech|whisper|dall|audio|realtime|moderation|video/i.test(id))continue;
  const n=id.split(/[\/:]/).pop();if(MODELS.some(m=>m.id===n||m.id===id)||add.some(m=>m.n===n))continue;add.push({id,f,n})}
 add.sort((a,b)=>b.n.localeCompare(a.n,undefined,{numeric:true}));MODELS=MODELS.concat(add);buildMenu()}catch(e){}}
async function loadOR(){if(!S.cfg.or)return;try{const j=await(await fetch('https://openrouter.ai/api/v1/models')).json();ORF={claude:[],gemini:[],gpt:[]};
 j.data.filter(m=>+m.pricing.prompt===0&&+m.pricing.completion===0).forEach(m=>{const f=fam(m.id);if(f)ORF[f].push(m.id)})}catch(e){}}
function gis(){return new Promise((ok,no)=>{const go=()=>{google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID,callback:r=>{try{const p=JSON.parse(decodeURIComponent(escape(atob(r.credential.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')))));S.user={n:p.given_name||p.name};ok()}catch(e){no(e)}}});google.accounts.id.prompt()};
 if(window.google&&google.accounts)go();else{const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=go;s.onerror=no;document.head.append(s)}})}
async function login(){vib(15);
 try{if(GOOGLE_CLIENT_ID)await gis();else{if(!window.puter)throw new Error('не загрузился Puter, проверьте интернет');await puter.auth.signIn();const u=await puter.auth.getUser();S.user={n:u.username||'Вы'}}
  save();upd();$('#gate').classList.add('off');loadPuter()}
 catch(e){S.skip=1;save();$('#gate').classList.add('off');toast('Вход не удался ('+((e&&(e.message||e.msg||e.error))||'ошибка')+'). Чат работает без входа'+(location.protocol==='file:'?'. Откройте файл с сайта (http), и вход заработает':''))}}
$('#gg').onclick=login;$('#sk').onclick=()=>{S.skip=1;save();$('#gate').classList.add('off')};
$('#un').onclick=()=>{if(S.user){if(confirm('Выйти из аккаунта?')){S.user=null;S.skip=0;save();upd();$('#gate').classList.remove('off')}}else login()};
['claude','gemini','gpt'].forEach(f=>$('#gl').append(img(f)));
$('#mb').onclick=e=>{e.stopPropagation();$('.mw').classList.toggle('on')};
document.onclick=()=>$('.mw').classList.remove('on');
$('#menu').onclick=e=>{e.stopPropagation();const t=e.target.closest('.it');if(t){S.model=t.dataset.id;vib(10);save();upd();$('.mw').classList.remove('on')}};
const tr=$('#tr');let drag=0;
let ls=-1;const mv=e=>{const r=tr.getBoundingClientRect(),p=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),i=Math.round(p*2);tr.style.setProperty('--p',p);if(i!==ls){ls=i;vib(8);$('#ev').textContent=['Быстро','Норма','Глубоко'][i]}};
tr.onpointerdown=e=>{drag=1;ls=ev();tr.classList.add('dr');tr.setPointerCapture(e.pointerId);mv(e)};
tr.onpointermove=e=>{if(drag)mv(e)};
tr.onpointerup=()=>{if(!drag)return;drag=0;tr.classList.remove('dr');const i=Math.round(parseFloat(tr.style.getPropertyValue('--p'))*2);S.eff[ek()]=i;save();upd()};
$('#nc').onclick=newChat;$('#bg').onclick=()=>$('#sb').classList.add('open');$('#sc').onclick=()=>$('#sb').classList.remove('open');
$('#go').onclick=send;
$('#in').oninput=function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,160)+'px'};
$('#in').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!/Mobi|Android/i.test(navigator.userAgent)){e.preventDefault();send()}};
$('#st').onclick=()=>{const C=S.cfg;$('#c_or').value=C.or||'';$('#c_gk').value=C.gk||'';$('#c_x').value=C.extra&&C.extra.length?JSON.stringify(C.extra,null,1):'';$('#dlg').showModal()};
$('#sv').onclick=()=>{let x=[];try{x=JSON.parse($('#c_x').value||'[]')}catch(e){return toast('JSON не разобран, проверьте скобки и кавычки')}
 S.cfg={or:$('#c_or').value.trim(),gk:$('#c_gk').value.trim(),extra:x};save();$('#dlg').close();loadOR();toast('Настройки сохранены')};
$('#px2').onclick=()=>$('#dlg').close();$('#px').onclick=()=>$('#pv').close();
document.querySelectorAll('dialog').forEach(d=>d.onclick=e=>{if(e.target===d)d.close()});
if(!S.chats.length)newChat();else{if(!chat())S.cur=S.chats[0].id;drawList();drawChat()}
buildMenu();
if(S.user||S.skip)$('#gate').classList.add('off');
if(window.puter)loadPuter();loadOR();
